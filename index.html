<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI News Digest</title>
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS home-screen app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Digest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <h1>AI News Digest</h1>
  <div class="tabs">
    <button id="tab-today" class="tab active" data-view="today">Today</button>
    <button id="tab-history" class="tab" data-view="history">History</button>
  </div>
</header>

<main id="content">
  <div id="loading" class="status">Loading…</div>
</main>

<div id="pull-hint" class="pull-hint" hidden>Release to refresh…</div>

<script src="./vendor/marked.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
