<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI News Digest</title>
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS home-screen app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Digest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <div class="titlerow">
    <h1>AI News Digest</h1>
    <button id="notify-btn" class="notify-btn" title="Daily notification">🔔</button>
  </div>
  <div class="tabs">
    <button id="tab-today" class="tab active" data-view="today">Today</button>
    <button id="tab-history" class="tab" data-view="history">History</button>
  </div>
</header>

<main id="content">
  <div id="loading" class="status">Loading…</div>
</main>

<!-- One-time notification hand-off: shown after subscribing. -->
<div id="notify-panel" class="panel" hidden>
  <div class="panel-card">
    <h2>Finish enabling notifications</h2>
    <p>Copy the code below, then on your Mac run this once in Terminal:</p>
    <pre class="cmd">cd ~/code/work/ai-news-agent
./.venv/bin/python -m utils.push_register '&lt;paste code&gt;'</pre>
    <textarea id="sub-blob" readonly rows="5"></textarea>
    <div class="panel-actions">
      <button id="copy-sub" class="btn-primary">Copy code</button>
      <button id="close-panel" class="btn-ghost">Done</button>
    </div>
    <p id="notify-msg" class="notify-msg"></p>
  </div>
</div>

<div id="pull-hint" class="pull-hint" hidden>Release to refresh…</div>

<script src="./vendor/marked.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
